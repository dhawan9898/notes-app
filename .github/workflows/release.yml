name: Release Android app
# Every push to main: bump the version, build a signed APK, tag the commit and publish a GitHub Release with the APK attached.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.github/workflows/checks.yml', '.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (overrides commit-message rules)'
        type: choice
        options: [auto, patch, minor, major]
        default: auto
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }      # tags and history are needed to compute the next version

      - name: Compute next version
        id: ver
        env:
          BUMP_INPUT: ${{ github.event.inputs.bump }}
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor patch <<< "${last#v}"
          range=$([ "$last" = v0.0.0 ] && echo HEAD || echo "$last..HEAD")
          msgs=$(git log "$range" --format=%B)
          bump=${BUMP_INPUT:-auto}
          if [ "$bump" = auto ]; then
            if echo "$msgs" | grep -qiE 'BREAKING CHANGE|#major|^[a-z]+(\(.+\))?!:'; then bump=major
            elif echo "$msgs" | grep -qiE '#minor|^feat(\(.+\))?:'; then bump=minor
            else bump=patch; fi
          fi
          case $bump in
            major) major=$((major+1)); minor=0; patch=0;;
            minor) minor=$((minor+1)); patch=0;;
            *)     patch=$((patch+1));;
          esac
          [ "$last" = v0.0.0 ] && [ "$bump" = patch ] && { major=1; minor=0; patch=0; }   # first release is 1.0.0
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "previous=$last" >> "$GITHUB_OUTPUT"
          echo "Next version: $major.$minor.$patch ($bump bump from $last)"

      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5

      - run: npm ci
      - name: Toolchain for the in-browser Linux (static 32-bit programs, needs clang, lld and llvm-ar)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld llvm
      - uses: actions/cache@v4
        with: { path: .cache/vm, key: vm-toolchain-v1 }
      - name: Build the site (base path /) and copy it into the Android project
        run: npm run app:sync

      - name: Restore private signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Using the private signing key from repository secrets"
          else
            echo "No signing secrets set: using the repository's stable sideload key (updates still install over each other)"
          fi

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease -PversionName=${{ steps.ver.outputs.version }} -PversionCode=${{ steps.ver.outputs.code }}

      - name: Name the artifact and verify it
        id: apk
        run: |
          out="DeepNotes-v${{ steps.ver.outputs.version }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$out"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$out" | head -3
          ls -lh "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          git tag "$tag" && git push origin "$tag"
          notes="Install: download **${{ steps.apk.outputs.file }}** on your Android phone and open it (allow installs from this source when asked). It installs over the previous version. Offline: all notes and the C compiler are inside the app."
          gh release create "$tag" "${{ steps.apk.outputs.file }}" --title "DeepNotes $tag" --notes "$notes" --generate-notes --latest

      - uses: actions/upload-artifact@v7
        with: { name: DeepNotes-apk, path: "${{ steps.apk.outputs.file }}" }

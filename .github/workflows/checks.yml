name: Checks
on:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"        # weekly link check, Monday 05:17 UTC
  workflow_dispatch:
jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run fetch-runner
      - name: Toolchain for the in-browser Linux (static 32-bit programs: clang, lld, llvm-ar)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld llvm
      - uses: actions/cache@v4
        with: { path: .cache/vm, key: vm-toolchain-v1 }
      - run: npm run fetch-linux
      - name: Content gate (front matter, lesson template, problems, paths, glossary, references)
        run: npm run validate
      - name: Generate data
        run: npm run data
      - name: Unit tests (storage layer, progress, practice, search, judge)
        run: npm test
      - name: UI lint (classes and data hooks defined and used)
        run: npm run lint:ui
      - name: Exercise starter programs (tests fail as shipped, pass with the reference solutions)
        run: npm run starters
      - name: Practice problems in the in-app compiler (starter is not accepted, solution is)
        run: npm run practice:verify
      - name: Linux terminal (examples, in-app labs and command blocks work in the in-browser Linux)
        run: npm run terminal:verify
      - name: Build site
        run: npm run build
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          BASE: /${{ github.event.repository.name }}
      - name: Built pages (links, anchors, headings, names)
        run: npm run check:dist
        env:
          BASE: /${{ github.event.repository.name }}
      - name: UI behaviour tests (jsdom, real page scripts, real compiler)
        run: npm run test:ui
  links:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check-links.py --out link-check.md
      - uses: actions/upload-artifact@v7
        with: { name: link-check, path: link-check.md }
